name: API regression (Newman)

on:
  push:
    branches: [main]
    paths:
      - "collections/**"
      - ".github/workflows/newman.yml"
  # Every Monday at 07:00 UTC; runs only if the Jira gate finds tickets.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      jira_gate:
        description: "Check Jira first, like the weekly schedule (run only if tickets are Ready for QA)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: newman-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jira-gate:
    name: Jira gate (Ready for QA tickets)
    # Scheduled runs always go through the gate; manual runs only with jira_gate.
    # Push and a plain manual run skip it and go straight to the regression.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.jira_gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_tickets: ${{ steps.gate.outputs.has_tickets }}
      ticket_count: ${{ steps.gate.outputs.ticket_count }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Fails the run (never skips silently) when secrets are missing or the login is not real.
      - name: Check Jira login and search tickets
        id: gate
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_JQL: ${{ vars.JIRA_JQL || 'labels = "api-testing" AND status = "Ready for QA" ORDER BY key' }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: bash scripts/jira-gate.sh

  newman:
    name: Run Petstore collection
    needs: jira-gate
    # Runs when the gate was not used (push, plain manual run),
    # or when the gate passed and found tickets.
    if: >-
      !cancelled() && (
        needs.jira-gate.result == 'skipped' ||
        (needs.jira-gate.result == 'success' && needs.jira-gate.outputs.has_tickets == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report_ready: ${{ steps.report.outputs.ready }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Newman 6 and HTML reporter
        run: npm install -g newman@6 newman-reporter-htmlextra@1

      - name: Run collection
        id: run
        run: |
          mkdir -p results site
          newman run collections/petstore-collection.json \
            --reporters cli,json,htmlextra \
            --reporter-json-export results/newman-report.json \
            --reporter-htmlextra-export site/index.html \
            --reporter-htmlextra-title "Petstore API regression" \
            --reporter-htmlextra-browserTitle "Petstore API regression"

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-report
          path: results/newman-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-html-report
          path: site/index.html
          if-no-files-found: warn
          retention-days: 14

      # Runs even when assertions fail, so the published report shows the failures.
      - name: Upload Pages artifact
        id: pages_artifact
        if: always() && github.ref == 'refs/heads/main' && steps.run.outcome != 'skipped' && hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Mark report ready for publishing
        id: report
        if: always() && steps.pages_artifact.outcome == 'success'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  publish-report:
    name: Publish HTML report to GitHub Pages
    needs: newman
    # Only when Newman really ran on main and produced a report (passed or failed assertions).
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.newman.outputs.report_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
